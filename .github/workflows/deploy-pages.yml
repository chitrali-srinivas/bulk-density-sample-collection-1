name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install
        run: |
          echo "## Install diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- node: $(node -v)" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: $(npm -v)" >> "$GITHUB_STEP_SUMMARY"
          echo "- pwd: $(pwd)" >> "$GITHUB_STEP_SUMMARY"
          ls -la package.json package-lock.json >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          set +e
          npm install --no-fund --no-audit --loglevel=verbose > install.log 2>&1
          code=$?
          set -e
          tail -n 120 install.log | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload install log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
